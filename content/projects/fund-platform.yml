title: سکوی تامین مالی داده های عمومی
year: 1398
status: dead
text: |
  <p>سکوی تامین مالی یک برنامه است که به افراد و گروه هایی که در زمینه ایجاد و توسعه داده
  های عمومی فعالیت می کنند کمک کند تا بتوانند نیاز های مالی خود را برطرف کنند. این
  سکو در حال حاضر از سه طریق این کار را انجام می دهد:</p>
  <h3 id="-">کارزار ها</h3>
  <p>در یک کارزار، تولید کننده داده عمومی قبل از شروع به تولید هزینه مورد نیاز را برآورد
  می کند و یک کارزار برای جمع آوری این هزینه ایجاد می کند. هر کسی که به این داده
  نیاز دارد می تواند قسمتی از این هزینه را پرداخت کند. افراد برای اعتماد می توانند
  به سابقه کسی که کارزار را ایجاد کرده مراجعه کنند یا از او ضمانت قانونی بگیرند. در
  صورتی که جامعه به آن داده بیش از هزینه آن نیاز داشته باشد، هزینه مورد نیاز آن تامین
  می شود.</p>
  <h3 id="-">زیرساخت ها</h3>
  <p>بعضی از زیرساخت ها هستند که سود آن ها به همه جامعه می رسد و عمومی است، اما نگهداری آن ها
  به هزینه جاری و مستمر نیاز دارد. از این زیرساخت ها می توان به زیرساخت های داده کاوی
  که خروجی آن ها عمومی است یا زیرساخت سرور های سایت ها که می توانند به همه خدمات دهند
  اشاره کرد. در سکوی تامین مالی قسمتی برای تامین مالی هزینه این زیرساخت ها در نظر گرفته
  شده است.</p>
  <h3 id="-">افراد</h3>
  <p>افراد زیادی هستند که از روی عشق و علاقه خود به داده های عمومی در حوزه مربوط به علاقه شان
  آن ها را توسعه می دهند و وقت خود را صرف داده های عمومی می کنند. هم چنین فعالانی در حوزه
  داده های عمومی وجود دارند که برای تبلیغ و گسترش داده های عمومی و ایده های مرتبط با آن
  تلاش می کنند. این افراد ممکن است در تامین هزینه های زندگی خود با مشکل مواجه شده یا
  مجبور شوند که در کنار فعالیتشان کار کنند و نتوانند از همه ظرفیت خود در راستای داده های
  عمومی استفاده کنند. با استفاده از این بستر شما می توانید افراد فعال را پیدا کنید و اگر
  فعالیت آن ها را دوست داشتید از آن ها حمایت کنید.</p>
  <h2 id="-">استفاده از سکو برای فعالیت های غیر مرتبط</h2>
  <p>نرم افزار سکو یک داده عمومی است و شما می توانید به هر طریقی از آن استفاده کنید. اما
  نسخه ای که توسط جمعیت اداره می شود، پیرو قوانین جمعیت است و نمی توان از آن به جز برای
  داده های عمومی استفاده کرد. اگر می خواهید برای استفاده های دیگر (مثلا برای خیریه) از
  آن استفاده کنید می توانید خودتان یک نسخه از آن را راه اندازی کنید.</p>
