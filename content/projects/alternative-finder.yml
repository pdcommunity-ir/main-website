title: جایگزین یاب
status: ready
year: 1399
link: alternative.pdcommunity.ir
text: |
  <p>
    جایگزین یاب یک نرم افزار است که به کمک آن
    می توانید جایگزین های خدمات و نرم افزار های انحصاری را پیدا کنید
    و از آن ها کمتر استفاده کنید. داده های مورد نیاز
    این نرم افزار از
    <a href="/projects/index-wiki/">
      فهرست داده های عمومی
    </a>
    تامین می شود.
  </p>