slides:
  - data:
      x: -1000
      y: -1500
    content: |
      <p>ما در جهان بدی زندگی می کنیم</p>
  - data:
      y: -1500
    content: |
      <q>ثروت ۲۶ نفر برابر ثروت نیمی از مردم جهان است</q>
  - data:
      x: 1000
      y: -1500
    content: |
      <q>گرسنگی در رتبه اول مرگ و میر است، با این که ما تجهیزاتی داریم که می توانیم با آن تمام زمین را به زیر کشت بگیریم</q>
  - data:
      id: gavvvv
      className: skip
      scale: 1
      y: -2200
    content: |
      <h2>این وضع قابل قبول نیست</h2>
      <q>چه باید کرد؟</q>
  - data:
      scale: 2
      y: -1500
  - type: group # pd rescue us
    data:
      y: 1000
    child:
      - content: |
          <p>
          <img src="/dist/static/images/main-background.svg">
          <q>داده های عمومی می تواند ما را از این وضع نجات دهد</q>
          </p>
      - data:
          x: 300
          y: 170
          scale: 0.2
        content: |
          <p>
            منظور از داده چیزی است که می توان روی اینترنت به اشتراک گذاشت. مثل
            کتاب، فیلم، مقاله علمی، طرح صنعتی، کد نرم افزار و ...
          </p>
      - data:
          x: 200
          y: 70
          scale: 0.2
        content: |
          <p>
            داده عمومی داده ای است که سازندگان آن به همه اجازه و دسترسی می دهند تا از
            آن داده هر استفاده ای بکنند.
          </p>
      - content: |
          <p>
          <img src="/dist/static/images/main-background.svg">
          <q>داده های عمومی می تواند ما را از این وضع نجات دهد</q>
          </p>
      - data:
          x: -30
          y: -85
          scale: 0.05
        content: |
          <p>داده ها را روی شبکه اینترنت به اشتراک می گذاریم</p>
      - data:
          x: -20
          y: -193
          scale: 0.05
        content: |
          <p>تا با یک دیگر برابر شویم</p>
      - content: |
          <p>
          <img src="/dist/static/images/main-background.svg">
          <q>داده های عمومی می تواند ما را از این وضع نجات دهد</q>
          </p>
      
  - type: group # ehtekar
    data:
      x: 1000
      y: 1000
      yt: 500
    child:
      - content: |
          <p>
            داده های عمومی بدون این که چیزی از کسی کم کنند، به بقیه اضافه می کنند.
          </p>
          <p>
            نیازی نیست نهارتان را با بقیه تقسیم کنید و خودتان کمتر بخورید. آن را کپی
            کنید و در عین حال که خودتان از آن استفاده می کنید، به بقیه نیز بدهید.
          </p>
      - content: |
          <p>
            داده ای که عمومی نباشد، انحصاری است و تعیین این که چه کسی می تواند
            چه استفاده ای از آن داده بکند در انحصار افرادی خاص است.
          </p>
      - content: |
          <p>
            انحصار داده مثل این است که گندم ها را به دریا بریزیم یا جوجه های یک روزه را
            دفن کنیم تا بقیه بدبخت شوند و ما از بدبختی آن ها سود کنیم.
          </p>
      - content: |
          <p>
            یا با این که می توانیم با یک هزینه کم یک منطقه را سیر کنیم، آن ها
            را گرسنه نگه داریم تا برای یک لقمه نان، مجبور شوند بردگی کنند.
          </p>
      - content: |
          <p>
            چرا وقتی با هزینه صفر (به لطف کامپیوتر و اینترنت) می توانیم از یک داده
            بی نهایت نسخه تولید کنیم و به همه مردم جهان بدهیم، این کار را نکنیم؟
          </p>
      - content: |
          <p>انحصار داده همان احتکار داده است</p>
          <p>احتکار کاری اخلاقی نیست<p>
  
  - type: group # pd out of computer
    data:
      x: 3000
      yt: 500
    child:
      - content: |
          <p>ممکن است بگویید داده ها روی زندگی من تاثیر چندانی ندارند</p>
      - content: |
          <p>اما تقریبا در تمام شئون زندگی ما داده ها نقش اساسی دارند</p>
      - type: group
        child:
          - content: |
              <p>با پرینتر سه بعدی  می توانید داده ها را تبدیل به اجسام
              قابل لمس کنید.</p>
          - data:
              x: 100
              y: -100
              scale: 0.2
            content: |
              <p>پرینتری که خود داده عمومی است
              و می تواند خودش را پرینت کند! به همین دلیل قیمت آن
              در حد یک گوشی موبایل است</p>
      - content: |
          <p>با داده های عمومی می توانید در آپارتمان خود کشاورزی کنید</p>
      - content: |
          <p>با روش های مدرنی که بدون خاک، بدون آفت و با مصرف آب ده برابر
          کمتر انجام می شوند. روش هایی که داده های عمومی هستند و می توانید
          آن ها را از اینترنت بدون هیچ هزینه ای ببینید</p>
      - content: |
          <p>داده های عمومی می توانند در هر مرحله از زنجیره تولید هزینه ها
          را کاهش دهند و تاثیر خوبی روی قیمت نهایی محصولات بگذارند.</p>
      - content: |
          <p>قیمت دارو ها به شدت تحت تاثیر انحصار داده است. اگر داده های
          دارو ها عمومی شوند، می توانید دارو هایی که دانه هایشان قیمت میلیونی
          دارند را کیلویی بخرید!</p>
      - content: |
          <p>داده ها همه جا هستند و پیشرفت داده های عمومی روی زندگی شما تاثیر
          مستقیم و قابل لمسی خواهد داشت. (و قبلا داشته است اما شاید به آن توجه
          نکرده باشید)</p>
      - content: |
          <p>وقتی همه چیز را بدانیم، در حقیقت همه چیز را داریم</p>
  - type: group # pd and money
    data:
      x: 4000
      yt: 500
    child:
      - content: |
          <p>اما آیا از توسعه داده های عمومی می توان سود کرد؟</p>
          <p>یا باید از طمع دور شد و بیخیال سود شد؟</p>
          <p>چرا کسی باید داده هایش را عمومی کند؟</p>
      - content: |
          <p>دوری از طمع خوب است، اما ضروری نیست</p>
      - content: |
          <p>شرکت هایی وجود دارند که
          میلیارد ها دلار در سال از داده های عمومی درآمد کسب می کنند</p>
      - content: |
          <p>و روش های مختلفی برای کسب درآمد از داده های عمومی وجود دارد</p>
      - content: |
          <p>حتی بعضا کسب درآمد از داده های عمومی راحت تر است زیرا داده های عمومی
          بهینه تر از داده های انحصاری هستند.</p>
      - content: |
          <p>داده های عمومی ارزشی تولید می کنند که در داده های انحصاری تلف می شد و
          سود آن به هیچ کس نمی رسید.</p>
          <p>سازنده می تواند سیاست هایی را در پیش بگیرد که قسمتی از این ارزش به
          خودش برسد.</p>
      - content: |
          <p>به همین دلیل ابرشرکت هایی مانند گوگل و فیسبوک به داده های عمومی
          علاقه بسیاری دارند و بعضی از پروژه هایشان را به صورت عمومی منتشر
          می کنند (برای مثال اندروید)</p>
      - content: |
          <p>داده های عمومی هم به نفع جامعه اند و هم به نفع تولید کنندگان آن داده</p>
          <p>یک بازی برد-برد</p>
  

